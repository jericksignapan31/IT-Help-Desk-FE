<div class="pwa-status">
  <!-- Online/Offline Indicator -->
  <div class="status-item" *ngIf="(isOnline$ | async) === false">
    <mat-icon class="offline-icon">cloud_off</mat-icon>
    <span class="status-text">You are offline</span>
  </div>

  <!-- Install Prompt (from browser) -->
  <div class="status-item" *ngIf="installPrompt$ | async as prompt">
    <button
      mat-raised-button
      color="primary"
      (click)="installApp()"
      class="install-button"
    >
      <mat-icon>download</mat-icon>
      Install App
    </button>
  </div>

  <!-- Manual Install Button (for development/HTTP) -->
  <div class="status-item" *ngIf="!(installPrompt$ | async) && isDevMode">
    <button
      mat-raised-button
      color="accent"
      (click)="showInstallInstructions()"
      class="install-button dev-install"
    >
      <mat-icon>download</mat-icon>
      Install App
    </button>
  </div>

  <!-- Update Available with Action Button -->
  <div class="status-item" *ngIf="updateAvailable$ | async">
    <mat-icon class="update-icon">update</mat-icon>
    <span class="status-text">Update available</span>
    <button
      mat-icon-button
      (click)="updateApp()"
      title="Click to update"
      class="update-button"
    >
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
</div>
