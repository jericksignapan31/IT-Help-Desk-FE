<div class="employee-list-container">
  <div class="header">
    <h1>Employees</h1>
    <button mat-raised-button color="primary" routerLink="/employees/create">
      <mat-icon>add</mat-icon>
      Add Employee
    </button>
  </div>

  <mat-card class="search-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search</mat-label>
      <input
        matInput
        [(ngModel)]="searchText"
        placeholder="Search by name, email..."
      />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <mat-card>
    <div class="table-container">
      <table mat-table [dataSource]="employees" class="employee-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let employee">
            <strong>{{ getFullName(employee) }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let employee">{{ employee.email }}</td>
        </ng-container>

        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>Position</th>
          <td mat-cell *matCellDef="let employee">{{ employee.position }}</td>
        </ng-container>

        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let employee">
            {{ employee.department?.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="branch">
          <th mat-header-cell *matHeaderCellDef>Branch</th>
          <td mat-cell *matCellDef="let employee">
            {{ employee.branch?.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let employee">
            <button
              mat-icon-button
              [routerLink]="['/employees', employee.id]"
              matTooltip="View Details"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              [routerLink]="['/employees/edit', employee.id]"
              matTooltip="Edit"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="employee-row"
        ></tr>
      </table>

      <div *ngIf="employees.length === 0 && !loading" class="no-data">
        <mat-icon>people</mat-icon>
        <p>No employees found</p>
      </div>
    </div>
  </mat-card>
</div>
