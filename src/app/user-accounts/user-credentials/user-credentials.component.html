<div class="credentials-container">
  <div class="header">
    <h1>User Credentials</h1>
  </div>

  <mat-card>
    <div class="table-container">
      <!-- Loading Spinner -->
      <div *ngIf="loading" class="loading-spinner">
        <mat-spinner></mat-spinner>
        <p>Loading credentials...</p>
      </div>

      <!-- Credentials Table -->
      <table
        mat-table
        [dataSource]="credentials"
        class="credentials-table"
        *ngIf="!loading"
      >
        <!-- Username Column -->
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Username</th>
          <td mat-cell *matCellDef="let credential">
            <strong>{{ credential.username }}</strong>
          </td>
        </ng-container>

        <!-- Password Column -->
        <ng-container matColumnDef="password">
          <th mat-header-cell *matHeaderCellDef>Password</th>
          <td mat-cell *matCellDef="let credential">
            <span class="password-text">{{
              maskPassword(credential.password)
            }}</span>
            <button
              mat-icon-button
              (click)="resetPassword(credential)"
              matTooltip="Reset to default password"
              color="primary"
              class="reset-inline-btn"
            >
            </button>
          </td>
        </ng-container>

        <!-- Account Status Column -->
        <ng-container matColumnDef="account_status">
          <th mat-header-cell *matHeaderCellDef>Account Status</th>
          <td mat-cell *matCellDef="let credential">
            <mat-chip
              [class.status-active]="credential.account_status === 'Active'"
              [class.status-inactive]="credential.account_status !== 'Active'"
            >
              {{ credential.account_status }}
            </mat-chip>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let credential">
            <button
              mat-raised-button
              color="primary"
              (click)="resetPassword(credential)"
              matTooltip="Reset Password"
            >
              <mat-icon>lock_reset</mat-icon>
              Reset Password
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="credential-row"
        ></tr>
      </table>

      <!-- Empty State -->
      <div *ngIf="credentials.length === 0 && !loading" class="no-data">
        <mat-icon>lock</mat-icon>
        <p>No credentials found</p>
      </div>
    </div>
  </mat-card>
</div>
