<div class="my-tickets-container">
  <div class="header">
    <h1>My Tickets</h1>
    <button mat-raised-button color="primary" routerLink="/tickets/create">
      <mat-icon>add</mat-icon>
      Create Ticket
    </button>
  </div>

  <mat-card>
    <div class="table-container">
      <table mat-table [dataSource]="tickets" class="ticket-table">
        <ng-container matColumnDef="ticket_number">
          <th mat-header-cell *matHeaderCellDef>Ticket #</th>
          <td mat-cell *matCellDef="let ticket">
            <strong>{{ ticket.ticket_number }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let ticket">{{ ticket.title }}</td>
        </ng-container>

        <ng-container matColumnDef="priority">
          <th mat-header-cell *matHeaderCellDef>Priority</th>
          <td mat-cell *matCellDef="let ticket">
            <mat-chip [ngClass]="getPriorityClass(ticket.priority)">
              {{ ticket.priority }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let ticket">
            <mat-chip [ngClass]="getStatusClass(ticket.status)">
              {{ ticket.status }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let ticket">
            {{ formatDate(ticket.created_at) }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let ticket">
            <button
              mat-icon-button
              [routerLink]="['/tickets', ticket.id]"
              matTooltip="View Details"
            >
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="ticket-row"
        ></tr>
      </table>

      <div *ngIf="tickets.length === 0 && !loading" class="no-data">
        <mat-icon>inbox</mat-icon>
        <p>You haven't created any tickets yet</p>
        <button mat-raised-button color="primary" routerLink="/tickets/create">
          Create Your First Ticket
        </button>
      </div>
    </div>
  </mat-card>
</div>
