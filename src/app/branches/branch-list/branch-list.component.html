<div class="branch-list-container">
  <div class="header">
    <h1>Branches</h1>
    <button mat-raised-button color="primary" routerLink="/branches/create">
      <mat-icon>add</mat-icon>
      Add Branch
    </button>
  </div>

  <mat-card>
    <div class="table-container">
      <table mat-table [dataSource]="branches" class="branch-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let branch">
            <strong>{{ branch.name }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let branch">{{ branch.address }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let branch">{{ branch.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let branch">{{ branch.email }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let branch">
            <button
              mat-icon-button
              [routerLink]="['/branches/edit', branch.id]"
              matTooltip="Edit"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div *ngIf="branches.length === 0 && !loading" class="no-data">
        <mat-icon>business</mat-icon>
        <p>No branches found</p>
      </div>
    </div>
  </mat-card>
</div>
