<div class="branch-list-container">
  <div class="header">
    <h1>Branches</h1>
    <button mat-raised-button color="primary" (click)="createBranch()">
      <mat-icon>add</mat-icon>
      Add Branch
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="!isLoading && branches.length === 0" class="empty-state">
        <mat-icon>business</mat-icon>
        <h2>No branches found</h2>
        <p>Get started by adding your first branch</p>
        <button mat-raised-button color="primary" (click)="createBranch()">
          <mat-icon>add</mat-icon>
          Add Branch
        </button>
      </div>

      <div *ngIf="!isLoading && dataSource.data.length > 0" class="table-container">
        <table mat-table [dataSource]="dataSource" class="branches-table">
          <!-- Branch Name Column -->
          <ng-container matColumnDef="branch_name">
            <th mat-header-cell *matHeaderCellDef>Branch Name</th>
            <td mat-cell *matCellDef="let branch">
              <strong>{{ branch.branch_name }}</strong>
            </td>
          </ng-container>

          <!-- Location Column -->
          <ng-container matColumnDef="location">
            <th mat-header-cell *matHeaderCellDef>Location</th>
            <td mat-cell *matCellDef="let branch">
              {{ branch.location }}
            </td>
          </ng-container>

          <!-- Contact Number Column -->
          <ng-container matColumnDef="contact_number">
            <th mat-header-cell *matHeaderCellDef>Contact Number</th>
            <td mat-cell *matCellDef="let branch">
              {{ branch.contact_number || "N/A" }}
            </td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let branch">
              <mat-chip
                [class.status-active]="branch.status === 'active'"
                [class.status-inactive]="branch.status !== 'active'"
              >
                {{ branch.status | titlecase }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let branch">
              <button
                mat-icon-button
                color="primary"
                (click)="editBranch(branch)"
                matTooltip="Edit"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                [color]="branch.status === 'active' ? 'warn' : 'accent'"
                (click)="toggleStatus(branch)"
                [matTooltip]="
                  branch.status === 'active' ? 'Deactivate' : 'Activate'
                "
              >
                <mat-icon>{{
                  branch.status === "active" ? "toggle_on" : "toggle_off"
                }}</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="deleteBranch(branch)"
                matTooltip="Delete"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
