<div class="department-list-container">
  <div class="header">
    <h1>Departments</h1>
    <button mat-raised-button color="primary" (click)="createDepartment()">
      <mat-icon>add</mat-icon>
      Add Department
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="!isLoading && departments.length === 0" class="empty-state">
        <mat-icon>corporate_fare</mat-icon>
        <h2>No departments found</h2>
        <p>Get started by adding your first department</p>
        <button mat-raised-button color="primary" (click)="createDepartment()">
          <mat-icon>add</mat-icon>
          Add Department
        </button>
      </div>

      <div *ngIf="!isLoading && departments.length > 0" class="table-container">
        <table mat-table [dataSource]="departments" class="departments-table">
          <!-- Department Name Column -->
          <ng-container matColumnDef="department_name">
            <th mat-header-cell *matHeaderCellDef>Department Name</th>
            <td mat-cell *matCellDef="let department">
              <strong>{{ department.department_name }}</strong>
            </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let department">
              {{ department.description || "N/A" }}
            </td>
          </ng-container>

       
          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let department">
              <mat-chip
                [class.status-active]="department.status === 'active'"
                [class.status-inactive]="department.status === 'inactive'"
              >
                {{ department.status === "active" ? "Active" : "Inactive" }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let department">
              <button
                mat-icon-button
                color="primary"
                (click)="editDepartment(department)"
                matTooltip="Edit"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                [color]="department.status === 'active' ? 'warn' : 'accent'"
                (click)="toggleStatus(department)"
                [matTooltip]="
                  department.status === 'active' ? 'Deactivate' : 'Activate'
                "
              >
                <mat-icon>{{
                  department.status === "active" ? "toggle_on" : "toggle_off"
                }}</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="deleteDepartment(department)"
                matTooltip="Delete"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
